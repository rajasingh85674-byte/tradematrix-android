name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Allocate Massive Swap Space (16GB Enterprise RAM Boost)
      run: |
        sudo swapoff -a || true
        sudo rm -f /swapfile
        sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        free -h

    - name: Install Advanced System Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          curl \
          wget \
          zip \
          unzip \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libreadline-dev \
          libffi-dev \
          libssl-dev \
          libsqlite3-dev \
          sqlite3 \
          bzip2 \
          libbz2-dev \
          liblzma-dev \
          tk-dev \
          libltdl-dev \
          cmake \
          ccache \
          libc6:i386 \
          libstdc++6:i386 \
          zlib1g:i386

    - name: Pre-setup Android SDK & Fix sdkmanager Path
      run: |
        SDK_DIR="/home/runner/.buildozer/android/platform/android-sdk"
        mkdir -p "$SDK_DIR/tools/bin"
        mkdir -p "$SDK_DIR/tools/lib"
        
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
        unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
        mkdir -p "$SDK_DIR/cmdline-tools/latest"
        cp -r /tmp/cmdtools/cmdline-tools/* "$SDK_DIR/cmdline-tools/latest/"
        
        ln -sf "$SDK_DIR/cmdline-tools/latest/bin/"* "$SDK_DIR/tools/bin/"
        ln -sf "$SDK_DIR/cmdline-tools/latest/lib/"* "$SDK_DIR/tools/lib/"
        rm -rf /tmp/cmdtools.zip /tmp/cmdtools

    - name: Pre-accept Android SDK Licenses
      run: |
        SDK_DIR="/home/runner/.buildozer/android/platform/android-sdk"
        mkdir -p "$SDK_DIR/licenses"
        echo -e "\n24333f8a43b681623c5ab016291f26d43585149f" > "$SDK_DIR/licenses/android-sdk-license"
        echo -e "\nd56f5187479451eabf01fb78af6dfcb131a64856" >> "$SDK_DIR/licenses/android-sdk-license"
        echo -e "\n84831b4009ab4a07f6ff0fc7ec1ce541ab083264" >> "$SDK_DIR/licenses/android-sdk-license"
        echo -e "\n2d619942a7b8e1f5af4c622ad44a03463878b275" >> "$SDK_DIR/licenses/android-sdk-license"

    - name: Install Advanced Python Build Tools
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install --upgrade buildozer cython requests colorama urllib3 certifi chardet idna

    - name: Create Clean buildozer.spec
      run: |
        rm -rf .buildozer/android/platform/python-for-android
        printf '%s\n' \
        "[app]" \
        "title = TradeMatrix" \
        "package.name = tradematrix" \
        "package.domain = org.tradematrix" \
        "source.dir = ." \
        "source.include_exts = py,png,jpg,kv,atlas,txt,json" \
        "version = 0.2" \
        "requirements = python3,kivy,openssl,sqlite3,requests,colorama,urllib3,certifi,chardet,idna" \
        "orientation = portrait" \
        "fullscreen = 0" \
        "android.permissions = INTERNET,ACCESS_NETWORK_STATE,WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE" \
        "android.api = 34" \
        "android.minapi = 21" \
        "android.ndk = 25b" \
        "android.python_version = 3.11" \
        "android.accept_sdk_license = True" \
        "android.archs = arm64-v8a" \
        "" \
        "[buildozer]" \
        "log_level = 2" \
        "warn_on_root = 1" > buildozer.spec

    - name: Build APK with Buildozer
      env:
        BUILDOZER_ALLOW_ROOT: "1"
        ACCEPT_BUILD_TOOLS_CHECKSUMS: "true"
        USE_CCACHE: "1"
        GOOGLE_API_KEY: "${{ secrets.GOOGLE_API_KEY }}"
      run: |
        export GOOGLE_API_KEY="${GOOGLE_API_KEY}"
        export MAKEOPTS="-j2"
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TradeMatrix-Advanced-App
        path: bin/*.apk
